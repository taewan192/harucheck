/* Shared color tokens keep calendars, labels, dialogs, and controls in the same theme. */
:root{color-scheme:light;--surface-soft:#f1f4f8;--field-bg:#fafbfd;--selection-bg:#f4f7ed;--selected-day:#202a35;--selected-fg:#ffffff;--primary-bg:#202a35;--primary-fg:#ffffff;--primary-hover:#354250;--accent-ink:#202a35;--pending-bg:#edf0f7;--pending-ink:#4e5c78;--done-bg:#e8f4ea;--failed-bg:#fae9e6;--task-done:#f1f8f1;--task-failed:#fff7f5;--done-border:#dceadd;--failed-border:#f0dfda;--done-button:#287a53;--failed-button:#b74b43;--outside:#a0a9b4;--saturday:#526f94;--badge-bg:#f0f7d9;--badge-ink:#52712e;--progress-done:#6b9c6a;--progress-failed:#d38f86}

.calendar,.task,.status-btn,.empty-mark,dialog{background:var(--paper)}
.brandmark{color:var(--accent-ink)}.range-tag{border-color:var(--line);color:var(--muted)}
.year-control,.weekdays,.date-eyebrow,.task-time,.task .edit,.status-label,.storage-note,.field .optional,.field input::placeholder{color:var(--muted)}
.weekdays span:last-child,.day.sat:not(.selected){color:var(--saturday)}
.today-btn,.secondary,.segments,.period-years,.count-pill,.progress-track{background:var(--surface-soft)}.count-pill{color:var(--muted)}
.task.done{background:var(--task-done);border-color:var(--done-border)}.task.done .task-title{color:var(--green)}
.task.failed{background:var(--task-failed);border-color:var(--failed-border)}.task.failed .task-title{color:var(--red)}

.status-btn.fail[aria-pressed=true]{background:var(--failed-button);border-color:var(--failed-button);color:white}
.primary{background:var(--primary-bg);color:var(--primary-fg)}.primary:hover{background:var(--primary-hover)}

.empty{border-color:var(--line)}.empty-mark{color:var(--green)}

.field select:focus-visible{outline:3px solid #719343;outline-offset:3px}.field select option{background:var(--paper);color:var(--ink)}
.reminder-preview{font-size:12px;color:var(--muted);margin:10px 0 0;line-height:1.7}.reminder-preview.past{color:var(--red)}
.notification-settings{margin-top:14px;border:1px solid var(--line);border-radius:12px;padding:0 12px;background:var(--field-bg)}
.notification-settings summary{cursor:pointer;min-height:44px;align-content:center;font-size:13px;font-weight:600;padding:10px 0}
.notification-settings p,.reminder-limit,.calendar-export-help{font-size:12px;color:var(--muted);line-height:1.7;margin:8px 0 12px}
.notification-actions{display:flex;flex-wrap:wrap;gap:8px;margin:8px 0}.notification-actions button{min-height:44px;border-radius:10px;padding:8px 12px;background:var(--surface-soft);font-size:12px;font-weight:600}
.task-reminder{display:block;font-size:12px;color:var(--muted);margin-top:7px;line-height:1.6}.task-reminder:before{content:'◷ ';font-size:14px}
.calendar-export{color:var(--green);font-size:13px;min-height:44px;width:100%;margin-top:4px}.calendar-export-help{margin:0;text-align:center}
.alarm-inbox{padding:18px;border-radius:20px;background:var(--paper);border:2px solid var(--label-pending-bg);margin-bottom:24px;box-shadow:0 5px 24px #15234014}
.alarm-top{display:flex;align-items:center;justify-content:space-between;gap:8px}.alarm-top h2{font-size:17px;margin:0}.alarm-top button{min-height:44px;padding:8px;font-size:13px;color:var(--muted)}
.alarm-item{display:flex;gap:12px;align-items:center;justify-content:space-between;border-top:1px solid var(--line);padding:14px 0 0;margin-top:10px}
.alarm-copy{min-width:0;flex:1;overflow-wrap:anywhere}.alarm-copy strong{font-size:15px}.alarm-copy p{font-size:12px;line-height:1.6;color:var(--muted);margin:5px 0 0}.alarm-view{flex:none;border-radius:10px;min-height:44px;padding:8px 12px;background:var(--lime);color:var(--accent-ink);font-size:13px;font-weight:600}

/* Mobile calendar: keep the day grid compact and the primary action in reach. */
.day-more{display:none}
@media(max-width:759px){
 .app{max-width:520px;padding:20px 16px calc(108px + env(safe-area-inset-bottom));min-height:100dvh}
 .topbar{flex-wrap:nowrap;gap:12px;margin-bottom:20px}
 .brand{gap:10px}.brand h1{font-size:20px;line-height:1.4}.brand p{font-size:9px;letter-spacing:1.1px}
 .header-actions{width:auto;flex:none}.theme-switch{padding:3px;border-radius:16px;gap:2px}
 .theme-switch button{width:44px;height:44px;min-height:44px;padding:12px;font-size:0;gap:0;border-radius:12px}
 .theme-switch button svg{width:20px;height:20px}
 .workspace{gap:24px}.calendar{padding:14px 8px 16px;border-radius:24px;border:1px solid var(--line)}
 .calendar-head{padding:0 8px}.year-control{min-height:32px;font-size:12px}.month-heading{font-size:30px;line-height:1.3}
 .month-nav{gap:0}.today-btn{height:44px;padding:0 12px;font-size:13px}
 .weekdays{margin-top:16px;height:28px;font-size:11px;align-items:center}
 .days{grid-auto-rows:minmax(48px,auto);gap:0}
 .day{min-height:48px;padding:5px 2px 7px;gap:4px;border-top:0;border-radius:12px}
 .day .number{width:30px;min-width:30px;height:30px;line-height:30px;border-radius:10px;font-size:13px}
 .day-labels{gap:3px}.event-label{display:flex;align-items:center;padding:2px 3px;font-size:10px;line-height:15px;min-height:19px;border-width:0;border-radius:4px;box-shadow:none;white-space:nowrap}
 .event-label .label-status{font-size:10px;flex:none}.event-title{min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
 .event-label:nth-child(n+3){display:none}.day-more{display:block;font-size:9px;font-weight:600;color:var(--muted);line-height:14px;text-align:center}
 .calendar-footer{padding-top:12px;margin:12px 8px 0;font-size:11px}.legend{gap:10px}.legend i{width:6px;height:6px;border-radius:2px}
 .agenda{padding:0 2px;min-width:0}.date-eyebrow{font-size:10px;letter-spacing:1.5px;margin-bottom:6px}.agenda h2{font-size:22px}
 .agenda-head{margin-bottom:16px}.count-pill{font-size:11px;padding:6px 8px}.day-badge{font-size:10px;padding:4px 7px;margin-left:7px}
 .empty{min-height:156px;border-style:solid;background:var(--paper);border-radius:22px;padding:20px 12px}
 .empty-mark{width:40px;height:40px;background:var(--surface-soft);border-radius:14px;margin-bottom:10px}.empty-mark svg{width:22px;height:22px}
 .empty h3{font-size:15px}.empty p{font-size:12px}.task{padding:16px;border:1px solid var(--line);border-radius:20px}.task-title{font-size:15px}
 .add-btn{position:fixed;bottom:calc(16px + env(safe-area-inset-bottom));left:50%;transform:translateX(-50%);width:calc(100% - 32px);max-width:488px;min-height:56px;margin:0;border:1px solid #a5c944;border-radius:18px;box-shadow:0 6px 24px #10172226;z-index:3}
 .storage-note{font-size:10px;margin-top:18px}.toast{bottom:calc(88px + env(safe-area-inset-bottom));font-size:13px}
 dialog:not(.delete-dialog){width:100%;max-width:520px;max-height:92dvh;margin:auto auto 0;border-radius:28px 28px 0 0;overscroll-behavior:contain}
 .sheet-inner{padding:24px 20px max(24px,env(safe-area-inset-bottom))}.sheet-top{margin-bottom:16px}.sheet-top h2{font-size:21px}
 .field{margin-top:18px}.field input,.field select{font-size:16px}.field input::placeholder{font-size:14px}
 .form-row{grid-template-columns:minmax(0,1.35fr) minmax(0,1fr);gap:10px}.form-footer{position:sticky;bottom:0;padding:12px 0 0;background:var(--paper);margin-top:12px;z-index:1}
 .form-footer button{min-height:54px}.notification-settings summary{min-height:48px}
}
@media(max-width:359px){.app{padding-left:12px;padding-right:12px}.brand p{font-size:8px;letter-spacing:.5px}.brand h1{font-size:18px}.brandmark{width:32px;height:32px}.topbar{gap:8px}.theme-switch button{width:40px}.form-row{grid-template-columns:minmax(0,1fr)}.legend{gap:7px}}

/* Settings, permission onboarding, and per-event alert preferences. */
.settings-button{display:flex;align-items:center;justify-content:center;gap:7px;min-height:48px;padding:10px 14px;border:1px solid var(--line);border-radius:16px;background:var(--paper);font-size:13px;font-weight:600;flex:none}
.settings-button svg{width:21px;height:21px}.settings-label{font-size:13px;margin:6px 0 12px}.settings-theme button{flex:1;width:auto;min-height:48px;font-size:14px;gap:7px;padding:10px 16px}.settings-theme{width:100%}
.settings-permission{margin-top:24px;padding-top:18px;border-top:1px solid var(--line)}.settings-permission p{font-size:12px;line-height:1.7;color:var(--muted)}.settings-permission button{width:100%;font-size:13px}.settings-done{width:100%;margin-top:24px}
.permission-gate{margin:30px auto 0;max-width:460px;padding:32px 24px;background:var(--paper);border:1px solid var(--line);border-radius:28px;text-align:center}
.permission-icon{height:64px;width:64px;border-radius:22px;background:var(--lime);color:#202a35;display:grid;place-items:center;margin:0 auto 24px}.permission-icon svg{width:30px;height:30px}
.permission-gate h2{font-size:24px;line-height:1.4;letter-spacing:-.6px;margin:0 0 16px}.permission-gate p{font-size:14px;color:var(--muted);line-height:1.8;margin:12px 0 20px;overflow-wrap:anywhere}.permission-gate button{width:100%;margin-top:12px;white-space:normal}.permission-gate #permission-reason:empty{display:none}
.alert-preferences{border:1px solid var(--line);border-radius:18px;padding:0 14px 14px;margin:20px 0 14px;min-width:0;background:var(--field-bg)}.alert-preferences.is-disabled{opacity:.5}.toggle-row{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:60px;font-size:14px;font-weight:600;cursor:pointer}
.toggle-row input{appearance:none;flex:none;width:44px;height:26px;margin:0;border:1px solid var(--line);border-radius:20px;background:var(--surface-soft);position:relative;cursor:pointer}.toggle-row input:before{content:'';position:absolute;width:18px;height:18px;left:3px;top:3px;border-radius:50%;background:var(--muted)}.toggle-row input:checked{background:var(--lime);border-color:#a5c944}.toggle-row input:checked:before{transform:translateX(18px);background:#202a35}
.field-help{font-size:12px;color:var(--muted);line-height:1.75;margin:10px 0;overflow-wrap:anywhere}.sound-name{font-size:13px;line-height:1.6;margin:8px 0 12px;overflow-wrap:anywhere}.file-picker{display:flex;align-items:center;justify-content:center;position:relative;min-height:48px;border:1px solid var(--line);border-radius:12px;background:var(--paper);padding:12px;font-size:13px;font-weight:600;cursor:pointer;text-align:center}.file-picker input{position:absolute;inset:0;width:100%;height:100%;opacity:0;cursor:pointer}.file-picker:focus-within{outline:3px solid #719343;outline-offset:3px}
.text-button{color:var(--green);font-size:12px;min-height:44px;padding:8px 0;text-decoration:underline;text-underline-offset:4px}.audio-actions{display:flex;gap:8px;flex-wrap:wrap}.audio-actions button{flex:1;min-width:70px;font-size:12px;padding:12px}.audio-actions button:first-child{flex:2}
.segments label>span>span{min-height:0;display:inline;font-size:inherit;color:inherit;box-shadow:none;background:none;padding:0}
.calendar-head>div:first-child{min-width:0;flex:1}.month-heading{overflow-wrap:anywhere}.calendar-footer,.legend,.task-bottom{flex-wrap:wrap}.alarm-top{flex-wrap:wrap}.alarm-top h2{flex:1}.month-grid button{padding:8px 4px;overflow-wrap:anywhere}.form-status legend{font-size:13px}
@media(max-width:759px){.settings-button{padding:10px 12px}.settings-theme button{width:auto;height:auto;font-size:14px;gap:7px;padding:10px}.settings-theme button svg{width:18px;height:18px}.permission-gate{margin-top:24px;padding:28px 20px}.permission-gate h2{font-size:22px}.permission-gate p{font-size:13px}.app:has(#permission-gate:not(.hidden)){padding-bottom:24px}.calendar-footer{row-gap:10px}.legend{gap:8px}.month-heading{font-size:clamp(21px,6.7vw,30px)}.agenda-head{align-items:flex-start}.agenda h2{font-size:20px}.count-pill{flex:none}.day-badge{display:inline-block;margin-top:4px}.date-eyebrow{letter-spacing:.5px}.alert-preferences{padding-left:12px;padding-right:12px}.task-bottom{row-gap:12px}.status-actions{margin-left:auto}.sound-name{font-size:12px}}
</style>
</head>
<body>
<main class="app">
 <header class="topbar">
  <div class="brand"><div class="brandmark" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="m5 12 4.5 4.5L19 7"/></svg></div><div><h1 data-i18n="app">하루체크</h1><p>ONE DAY AT A TIME</p></div></div>
  <div class="header-actions"><span class="range-tag">2026 — 2027</span><button type="button" id="settings-open" class="settings-button" data-i18n-aria="settings" aria-label="설정" aria-haspopup="dialog"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 3h6l1 3 3 1 2 5-2 5-3 1-1 3H9l-1-3-3-1-2-5 2-5 3-1Z"/><circle cx="12" cy="12" r="3"/></svg><span data-i18n="settings">설정</span></button></div>
 </header>
 <p id="storage-warning" class="storage-warning hidden" role="alert"></p>
 <section id="permission-gate" class="permission-gate" aria-labelledby="permission-title">
  <div class="permission-icon" aria-hidden="true"><svg viewBox="0 0 24 24"><path d="M18 8a6 6 0 0 0-12 0c0 7-3 7-3 9h18c0-2-3-2-3-9M9 21h6"/></svg></div>
  <h2 id="permission-title" data-i18n="permissionTitle">알림을 켜고 시작해요</h2>
  <p data-i18n="permissionBody"></p><p id="permission-reason" role="status"></p>
  <button class="primary" type="button" id="permission-request" data-i18n="allowPermission">알림 허용하고 시작</button>
  <button class="secondary" type="button" id="permission-recheck" data-i18n="recheck">권한 다시 확인</button>
 </section>
 <div id="app-content" class="hidden" inert>
  <aside id="alarm-inbox" class="alarm-inbox hidden" data-i18n-aria="alarmTitle" aria-label="일정 알림"><div class="alarm-top"><h2 data-i18n="alarmTitle">일정 알림</h2><button type="button" id="alarms-dismiss" data-i18n="allRead">모두 확인</button><button type="button" class="stop-audio" data-i18n="stop">중지</button></div><div id="alarm-items" role="log" aria-live="polite"></div></aside>
  <div class="workspace">
   <section class="calendar" data-i18n-aria="calendar" aria-label="월간 캘린더">
    <div class="calendar-head"><div><button class="year-control" id="period-open" aria-haspopup="dialog"><span id="year-label">2026</span><svg viewBox="0 0 24 24"><path d="m7 10 5 5 5-5"/></svg></button><h2 class="month-heading" id="month-label"></h2></div><div class="month-nav"><button class="icon-btn" id="prev-month" data-i18n-aria="prev" aria-label="이전 달"><svg viewBox="0 0 24 24"><path d="m14 7-5 5 5 5"/></svg></button><button class="today-btn" id="today" data-i18n="today">오늘</button><button class="icon-btn" id="next-month" data-i18n-aria="next" aria-label="다음 달"><svg viewBox="0 0 24 24"><path d="m10 7 5 5-5 5"/></svg></button></div></div>
    <div class="weekdays" aria-hidden="true"></div><div id="days" class="days" data-i18n-aria="dateSelect" aria-label="날짜 선택"></div>
    <div class="calendar-footer"><div class="legend"><span><i></i><span data-i18n="pending">예정</span></span><span><i class="green"></i><span data-i18n="done">완료</span></span><span><i class="red"></i><span data-i18n="failed">실패</span></span></div><span class="month-stat"><span data-i18n="monthTotal">이번 달</span> <b id="month-count"></b></span></div>
   </section>
   <section class="agenda" aria-labelledby="selected-title"><p id="date-eyebrow" class="date-eyebrow"></p><div class="agenda-head"><h2 id="selected-title"></h2><span id="task-count" class="count-pill"></span></div>
    <div class="progress-box hidden" id="progress-box"><div class="progress-label"><span id="progress-copy"></span><b id="progress-percent"></b></div><div class="progress-track" aria-hidden="true"><div id="progress-done" class="progress-done"></div><div id="progress-failed" class="progress-failed"></div></div></div>
    <div id="tasks" class="tasks"></div>
    <div id="empty" class="empty"><div class="empty-mark" aria-hidden="true"><svg viewBox="0 0 24 24"><rect x="4" y="5" width="16" height="16" rx="3"/><path d="M8 3v4m8-4v4M4 10h16m-8 4v4m-2-2h4"/></svg></div><h3 data-i18n="emptyTitle">아직 일정이 없어요</h3><p></p></div>
    <button class="primary add-btn" id="add-task"><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg><span data-i18n="add">일정 추가</span></button>
   </section>
  </div>
  <p class="storage-note"><svg viewBox="0 0 24 24"><rect x="5" y="10" width="14" height="11" rx="2"/><path d="M8 10V7a4 4 0 0 1 8 0v3"/></svg><span data-i18n="storageNote"></span></p>
 </div>
</main>
<dialog id="settings-dialog" aria-labelledby="settings-title"><div class="sheet-inner">
 <div class="sheet-top"><h2 id="settings-title" data-i18n="settings">설정</h2><button type="button" class="icon-btn" id="settings-close" data-i18n-aria="close" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
 <h3 class="settings-label" data-i18n="appearance">화면 모드</h3>
 <div class="theme-switch settings-theme" role="group" data-i18n-aria="appearance" aria-label="화면 모드"><button type="button" data-theme-choice="light" aria-pressed="true"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="4"/><path d="M12 2v2m0 16v2M2 12h2m16 0h2M5 5l1.5 1.5m11 11L19 19M5 19l1.5-1.5m11-11L19 5"/></svg><span data-i18n="light">화이트</span></button><button type="button" data-theme-choice="dark" aria-pressed="false"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 14.2A8.5 8.5 0 0 1 9.8 4a8.5 8.5 0 1 0 10.2 10.2Z"/></svg><span data-i18n="dark">다크</span></button></div>
 <label class="field" for="settings-language"><span data-i18n="language">언어</span><select id="settings-language"></select></label>
 <div class="settings-permission"><p id="settings-permission-state" role="status"></p><button type="button" class="secondary" id="settings-notification-test" data-i18n="notificationTest">테스트 알림</button></div>
 <button type="button" class="primary settings-done" id="settings-done" data-i18n="confirm">확인</button>
</div></dialog>
<dialog id="task-dialog" aria-labelledby="form-title"><div class="sheet-inner">
 <div class="sheet-top"><h2 id="form-title"></h2><button class="icon-btn" id="form-close" type="button" data-i18n-aria="close" aria-label="닫기"><svg viewBox="0 0 24 24"><path d="m6 6 12 12M6 18 18 6"/></svg></button></div>
 <form id="task-form" novalidate>
  <label class="field"><span data-i18n="name">일정 이름</span><input id="task-name" type="text" required maxlength="100" data-i18n-placeholder="placeholder" placeholder="어떤 일을 할 예정인가요?" autocomplete="off"></label>
  <div class="form-row"><label class="field"><span data-i18n="date">날짜</span><input type="date" id="task-date" required min="2026-01-01" max="2027-12-31"></label><label class="field"><span data-i18n="time">시간</span><span class="optional" data-i18n="optional">선택</span><input id="task-time" type="time"></label></div>
  <div class="reminder-settings"><label class="field" for="reminder-select"><span data-i18n="reminder">알림</span><select id="reminder-select"></select></label>
   <label class="field hidden" id="reminder-custom-field" for="reminder-custom"><span data-i18n="customAt"></span><input id="reminder-custom" type="datetime-local" step="60"></label><p id="reminder-preview" class="reminder-preview" aria-live="polite"></p>
   <fieldset class="alert-preferences" id="alert-preferences"><legend class="sr-only" data-i18n="reminder">알림</legend>
    <label class="toggle-row"><span data-i18n="sound">소리 알림</span><input type="checkbox" id="alert-sound" checked role="switch"></label>
    <div id="sound-controls"><label class="field" for="sound-file"><span data-i18n="soundFile">알림 소리</span></label><p id="sound-name" class="sound-name"></p>
     <label class="file-picker" for="sound-file"><span data-i18n="chooseFile">소리 파일 가져오기</span><input id="sound-file" type="file" accept="audio/*,.mp3,.wav,.ogg,.m4a,.aac,.flac,.webm,.opus" aria-describedby="file-help"></label>
     <button type="button" class="text-button" id="sound-reset" data-i18n="removeFile">기본음으로 변경</button><p id="file-help" class="field-help" data-i18n="fileHelp"></p><p class="field-help" data-i18n="soundHelp"></p>
    </div>
    <label class="toggle-row"><span data-i18n="vibration">진동 알림</span><input type="checkbox" id="alert-vibration" checked role="switch"></label><p class="field-help" data-i18n="vibrationHelp"></p>
    <div class="audio-actions"><button type="button" class="secondary" id="sound-preview" data-i18n="preview">미리 듣기·진동</button><button type="button" class="secondary stop-audio" data-i18n="stop">중지</button></div><p id="sound-feedback" role="status" class="field-help"></p>
   </fieldset>
   <p class="reminder-limit" data-i18n="reminderLimit"></p>
  </div>
  <fieldset class="form-status" id="form-status"><legend data-i18n="status">상태</legend><div class="segments"><label><input name="status" type="radio" value="pending" checked><span><span aria-hidden="true">○ </span><span data-i18n="pending">예정</span></span></label><label><input name="status" type="radio" value="done"><span><span aria-hidden="true">✓ </span><span data-i18n="done">완료</span></span></label><label><input name="status" type="radio" value="failed"><span><span aria-hidden="true">✕ </span><span data-i18n="failed">실패</span></span></label></div></fieldset>
  <p class="form-error" id="form-error" role="alert"></p>
  <div class="form-footer"><button type="button" class="secondary" id="form-cancel" data-i18n="cancel">취소</button><button class="primary" type="submit" id="form-save"></button></div>
  <button type="button" class="delete-link hidden" id="delete-open"><svg viewBox="0 0 24 24"><path d="M3 6h18M9 6V3h6v3M5 6l1 15h12l1-15M10 10v7m4-7v7"/></svg><span data-i18n="delete">일정 삭제</span></button><button type="button" id="calendar-export" class="calendar-export hidden" data-i18n="export"></button><p id="calendar-export-help" class="calendar-export-help hidden" data-i18n="exportHelp"></p>
 </form>
</div></dialog>

    if (reminder.kind === 'custom') return Number.isFinite(parseLocal(reminder.at));

      if (!event || event.status !== 'pending') return false;
      var at = resolve(event);
      var key = token(event);

help:'Пока приложение открыто, звучит выбранный файл или встроенный сигнал. Системный звук зависит от настроек устройства. Сайт не может выбрать стандартный звук будильника телефона.|Вибрация доступна только на поддерживаемых устройствах. На iPhone и некоторых других устройствах веб-вибрация не работает.|Напоминания проверяются при открытом приложении. Закрытие, сон и беззвучный режим могут помешать сигналу вовремя.|Это копия сохранённого события. Проверьте напоминания в календаре после импорта.|Для использования HaruCheck нужны уведомления. Нажмите кнопку и разрешите их в браузере.|Уведомления заблокированы. Разрешите их в настройках сайта и проверьте снова.|Уведомления здесь недоступны. Откройте HTTPS-сайт в поддерживаемом браузере. На iPhone добавьте приложение на экран «Домой» через Safari и запустите оттуда.|Браузер заблокировал звук. Нажмите кнопку проверки, чтобы включить его.|Выберите воспроизводимый аудиофайл до 10 МБ. Он сохраняется только на вашем устройстве.',

  const item={id:editing||(crypto.randomUUID?.()||'event-'+Date.now()+'-'+Math.random().toString(36).slice(2)),title,date,time,status,reminder,alert};
  const next=editing?events.map(x=>x.id===editing?item:x):[...events,item];
  if(!persist(next)){if(newSound)await M.remove(newSound).catch(()=>{});return;}
  const oldSound=original?.alert?.soundId;saving=false;closeForm();selectDate(date);notify(t(wasEditing?'updated':'added'));if(oldSound!==alert.soundId)await cleanSound(oldSound);
 }catch{formError('fileSaveError');if(newSound)await cleanSound(newSound);}
 finally{saving=false;$('task-form').inert=false;$('task-form').removeAttribute('aria-busy');updateSaveButton();if(M.permissionState(window)!=='granted')updatePermission();}
});
$('delete-open').addEventListener('click',()=>{const item=events.find(e=>e.id===editing);if(!item)return;$('delete-name').textContent=item.title;$('delete-dialog').showModal();});
$('delete-cancel').addEventListener('click',()=>$('delete-dialog').close());
$('delete-confirm').addEventListener('click',async()=>{const old=events.find(e=>e.id===editing);if(persist(events.filter(e=>e.id!==editing))){$('delete-dialog').close();closeForm();render();notify(t('deleted'));await cleanSound(old?.alert?.soundId);}});
function renderPeriod(){document.querySelectorAll('[data-year]').forEach(b=>{b.setAttribute('aria-pressed',String(Number(b.dataset.year)===periodYear));b.textContent=intl({year:'numeric'}).format(new Date(Number(b.dataset.year),0,1,12));});$('month-grid').replaceChildren();for(let m=0;m<12;m++){const date=new Date(periodYear,m,1,12),b=textNode('button',periodYear===viewYear&&m===viewMonth?'active':'',intl({month:'short'}).format(date));b.type='button';b.setAttribute('aria-label',intl({year:'numeric',month:'long'}).format(date));b.addEventListener('click',()=>{const day=Math.min(parseDate(selected).getDate(),new Date(periodYear,m+1,0).getDate());selectDate(dateKey(new Date(periodYear,m,day,12)));$('period-dialog').close();});$('month-grid').append(b);}}
$('period-open').addEventListener('click',()=>{if(!updatePermission())return;periodYear=viewYear;renderPeriod();$('period-dialog').showModal();});
$('period-close').addEventListener('click',()=>$('period-dialog').close());document.querySelectorAll('[data-year]').forEach(b=>b.addEventListener('click',()=>{periodYear=Number(b.dataset.year);renderPeriod();}));
$('prev-month').addEventListener('click',()=>moveMonth(-1));$('next-month').addEventListener('click',()=>moveMonth(1));$('today').addEventListener('click',()=>selectDate(todayKey));$('add-task').addEventListener('click',()=>openForm());for(const id of ['form-cancel','form-close'])$(id).addEventListener('click',closeForm);
$('task-name').addEventListener('input',()=>{updateSaveButton();$('form-error').textContent='';});$('reminder-select').addEventListener('change',()=>{M.stop();updateReminderForm();});for(const id of ['task-date','task-time','reminder-custom'])$(id).addEventListener('input',updateReminderForm);
$('calendar-export').addEventListener('click',()=>{const item=events.find(e=>e.id===editing);if(!item)return;const blob=new Blob([R.toICS(item,Date.now())],{type:'text/calendar;charset=utf-8'}),url=URL.createObjectURL(blob),link=document.createElement('a');link.href=url;link.download='HaruCheck-'+item.date+'.ics';document.body.append(link);link.click();link.remove();setTimeout(()=>URL.revokeObjectURL(url),60000);notify(t('exportHelp'));});
window.addEventListener('storage',e=>{if(e.key===THEME_KEY||e.key===null)applyTheme(e.key===null?'light':e.newValue);if(e.key===LOCALE_KEY||e.key===null)applyLocale(e.key===null?'ko':e.newValue);if(e.key===KEY||e.key===null)try{syncStorage(localStorage.getItem(KEY));}catch{storageInvalid=true;warning('storageLoadError');}});
window.addEventListener('focus',()=>{updatePermission();checkReminders();});document.addEventListener('visibilitychange',()=>{if(!document.hidden){updatePermission();checkReminders();}});
// Resume foreground audio on real user interaction, including after app relaunch.
for(const type of ['pointerdown','keydown'])document.addEventListener(type,event=>{if(event.isTrusted&&M.permissionState(window)==='granted')M.unlock().catch(()=>false);},{capture:true});
if(navigator.permissions?.query)navigator.permissions.query({name:'notifications'}).then(status=>{status.addEventListener('change',()=>{updatePermission();checkReminders();});}).catch(()=>{});
applyTheme(document.documentElement.dataset.theme);applyLocale(language);setInterval(()=>{updatePermission();checkReminders();},15000);
})();
